<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Форма</title>
    <style>
        form {
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: Arial, sans-serif;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 8px 0 15px 0;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        label {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <form action="#" method="post">
        <label>Логін:</label>
        <input type="text" name="login" placeholder="Введіть логін" required>

        <label>Електронна скринька:</label>
        <input type="email" name="email" placeholder="Введіть email" required>

        <label>Пароль:</label>
        <input type="password" name="password" placeholder="Введіть пароль" required>

        <input type="submit" value="Відіслати">
    </form>

</body>
</html>
